services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: forgemind
      POSTGRES_USER: forgemind
      POSTGRES_PASSWORD: forgemind
    ports:
      - "5433:5432"
    volumes:
      - forgemind_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgemind -d forgemind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forgemind_postgres:
